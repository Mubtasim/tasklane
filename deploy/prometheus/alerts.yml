# Example alert rules (design §16.3). Gauges are the same on every server
# copy, so they are aggregated with max; counters with sum. Nothing routes
# these to a notifier: see them firing at http://localhost:9090/alerts.
groups:
  - name: tasklane
    rules:
      - alert: TasklaneDown
        expr: up{job="tasklane"} == 0
        for: 1m
        annotations:
          summary: "Prometheus can't scrape {{ $labels.instance }}."

      - alert: TasklaneJobsStuck
        expr: max by (queue) (tasklane_oldest_ready_job_age_seconds) > 300
        for: 5m
        annotations:
          summary: "Queue {{ $labels.queue }} has had a ready job waiting over 5 minutes: no workers, or workers that stopped leasing."

      - alert: TasklaneDeadJobs
        expr: sum by (queue) (increase(tasklane_jobs_dead_total[10m])) > 0
        annotations:
          summary: "Jobs in queue {{ $labels.queue }} reached the dead-letter queue in the last 10 minutes."

      - alert: TasklaneReapRateHigh
        expr: |
          sum by (queue) (rate(tasklane_jobs_reaped_total[10m]))
            > 0.1 * sum by (queue) (rate(tasklane_jobs_leased_total[10m]))
        for: 10m
        annotations:
          summary: "Over 10% of leases in queue {{ $labels.queue }} expire: workers crash or handlers outlive their lease."

      - alert: TasklaneQueueFull
        expr: sum by (queue) (rate(tasklane_enqueue_refused_total[5m])) > 0
        for: 5m
        annotations:
          summary: "Queue {{ $labels.queue }} is refusing enqueues (max_depth reached)."

      - alert: TasklaneErrors
        expr: |
          sum(rate(tasklane_rpc_duration_seconds_count{code=~"Internal|Unavailable"}[5m]))
            > 0.05 * sum(rate(tasklane_rpc_duration_seconds_count[5m]))
        for: 5m
        annotations:
          summary: "Over 5% of RPCs fail with Internal or Unavailable."
