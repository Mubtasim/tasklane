# Envoy in front of the two Tasklane servers. It balances every request, not
# every connection: gRPC sends all of a client's calls over one HTTP/2
# connection, so a connection-level (L4) balancer would pin each worker to one
# server. Design §17.4.
static_resources:
  listeners:
    - name: grpc
      address: { socket_address: { address: 0.0.0.0, port_value: 7070 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: tasklane
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: tasklane_grpc
                            # A Lease long-poll waits up to 30 s (MaxWait);
                            # Envoy's 15 s default would cut it off.
                            timeout: 35s
                            retry_policy:
                              # Only requests that never reached a server: a
                              # Lease that did may already have leased jobs.
                              retry_on: connect-failure,refused-stream,reset-before-request
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: http
      address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: tasklane
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: tasklane_http
                            timeout: 35s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,reset-before-request
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: tasklane_grpc
      # A killed container's IP never answers, so the 5 s default only delays
      # failover; the servers share one Docker network, so 1 s is plenty.
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: tasklane_grpc
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: tasklane-1, port_value: 7070 } }, health_check_config: { port_value: 8080 } }
              - endpoint: { address: { socket_address: { address: tasklane-2, port_value: 7070 } }, health_check_config: { port_value: 8080 } }
      health_checks: &readyz
        - timeout: 1s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /readyz, codec_client_type: HTTP1 }
      outlier_detection: &outliers
        consecutive_gateway_failure: 3
        enforcing_consecutive_gateway_failure: 100
        base_ejection_time: 10s
    - name: tasklane_http
      # A killed container's IP never answers, so the 5 s default only delays
      # failover; the servers share one Docker network, so 1 s is plenty.
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: tasklane_http
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: tasklane-1, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: tasklane-2, port_value: 8080 } } }
      health_checks: *readyz
      outlier_detection: *outliers
