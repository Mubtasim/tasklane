# kind cluster for CI (CLUSTER=kind deploy/k8s/demo.sh up): the same host
# ports as the k3d demo.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30070, hostPort: 7070, listenAddress: 127.0.0.1 }
      - { containerPort: 30080, hostPort: 8080, listenAddress: 127.0.0.1 }
      - { containerPort: 30090, hostPort: 9090, listenAddress: 127.0.0.1 }
