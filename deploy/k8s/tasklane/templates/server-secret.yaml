{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "tasklane.labels" . | nindent 4 }}
type: Opaque
stringData:
  TASKLANE_DATABASE_URL: {{ required "databaseURL or existingSecret is required" .Values.databaseURL | quote }}
  TASKLANE_API_KEYS: {{ .Values.apiKeys | quote }}
{{- end }}
