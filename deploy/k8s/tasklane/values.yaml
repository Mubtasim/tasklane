# Tasklane server chart (design §20). Postgres is not included: point
# databaseURL (or existingSecret) at your database.

replicaCount: 2

# No image is published yet: ghcr.io/mubtasim/tasklane arrives with v1.0.0
# (milestone M5e). Until then build and push your own (docker build -t
# <registry>/tasklane:<tag> .) and set repository and tag. The local demo
# loads tasklane:dev into the cluster instead (demo/values.yaml).
image:
  repository: ghcr.io/mubtasim/tasklane
  tag: ""  # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# The server's secrets. Either set them here (the chart makes a Secret) or
# name an existing Secret with the keys TASKLANE_DATABASE_URL and
# TASKLANE_API_KEYS. The pods carry a hash of the chart-made Secret, so
# changing these values rolls them; an existingSecret is not hashed, so
# after rotating it run kubectl rollout restart deploy/<release>-server.
databaseURL: ""
apiKeys: ""  # comma-separated; empty turns authentication off
existingSecret: ""

# Other TASKLANE_* and OTEL_* settings, as plain environment variables.
env: {}

resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: "1", memory: 256Mi }

# Shutdown (design §20.3): keep serving for preStopSeconds while endpoints
# drop this pod, then the server's own drain (at most 24 s: HTTP 10, gRPC 10,
# metrics 2, trace flush 2), so the pod exits within 29 s, inside the grace
# period.
drain:
  preStopSeconds: 5
  terminationGracePeriodSeconds: 40

# The Service clients use, named after the release. It points at Envoy when
# envoy.enabled, else straight at the servers.
service:
  type: ClusterIP
  nodePorts:
    grpc: null
    http: null

envoy:
  enabled: true
  replicaCount: 2
  image: envoyproxy/envoy:v1.36.2
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }
