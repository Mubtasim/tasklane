# Tasklane demo: PostgreSQL, two servers behind Envoy, a producer, three
# workers, Prometheus, Grafana and Jaeger. From the repo root:
#   docker compose -f deploy/docker-compose.yml up --build
# then open http://localhost:3000 for the dashboard and http://localhost:16686
# for traces.
name: tasklane-demo

x-demo-env: &demo-env
  TASKLANE_ADDR: envoy:7070
  TASKLANE_API_KEY: ${TASKLANE_API_KEY:-demo-key}
  DEMO_QUEUE: demo
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

x-worker: &worker
  image: tasklane:dev
  pull_policy: never
  entrypoint: ["/usr/local/bin/worker"]
  # Longer than the worker's 25 s ShutdownTimeout: Docker's default is 10 s,
  # after which it sends SIGKILL.
  stop_grace_period: 30s
  depends_on: [envoy, jaeger]

# A merge key replaces a service's whole environment map, so the settings the
# two servers share live in their own anchor and each server adds its
# OTEL_SERVICE_NAME next to them.
x-server-env: &server-env
  TASKLANE_DATABASE_URL: postgres://tasklane:tasklane@postgres:5432/tasklane?sslmode=disable
  TASKLANE_API_KEYS: ${TASKLANE_API_KEY:-demo-key}
  TASKLANE_REAPER_INTERVAL: 2s
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

x-server: &server
  image: tasklane:dev
  # Both servers migrate at startup; the advisory lock in pgstore.Migrate
  # makes that safe.
  depends_on:
    postgres:
      condition: service_healthy
    jaeger:
      condition: service_started

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tasklane
      POSTGRES_PASSWORD: tasklane
      POSTGRES_DB: tasklane
    # Not published on the host, so it can't clash with a local PostgreSQL.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklane -d tasklane"]
      interval: 2s
      timeout: 3s
      retries: 30

  tasklane-1:
    <<: *server
    environment:
      <<: *server-env
      OTEL_SERVICE_NAME: tasklane-1
    build:
      context: ..
      dockerfile: Dockerfile

  tasklane-2:
    <<: *server
    environment:
      <<: *server-env
      OTEL_SERVICE_NAME: tasklane-2
    pull_policy: never

  # Owns the host ports 7070 (gRPC) and 8080 (HTTP). The admin interface is
  # not configured, so nothing else is exposed.
  envoy:
    image: envoyproxy/envoy:v1.36.2
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./envoy:/etc/envoy:ro
    ports:
      - "127.0.0.1:7070:7070"
      - "127.0.0.1:8080:8080"
    depends_on: [tasklane-1, tasklane-2]

  producer:
    image: tasklane:dev
    pull_policy: never
    entrypoint: ["/usr/local/bin/producer"]
    environment:
      <<: *demo-env
      DEMO_RATE: "10"
      OTEL_SERVICE_NAME: producer
    depends_on: [envoy, jaeger]

  worker-1:
    <<: *worker
    environment:
      <<: *demo-env
      WORKER_NAME: worker-1
      OTEL_SERVICE_NAME: worker-1

  worker-2:
    <<: *worker
    environment:
      <<: *demo-env
      WORKER_NAME: worker-2
      OTEL_SERVICE_NAME: worker-2

  worker-3:
    <<: *worker
    environment:
      <<: *demo-env
      WORKER_NAME: worker-3
      OTEL_SERVICE_NAME: worker-3

  # Traces from the servers, the producer and the workers. In-memory storage
  # capped at 10,000 traces; the UI is on http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger:/etc/jaeger:ro
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [tasklane-1, tasklane-2]

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      # Read-only and no login: a local demo, bound to 127.0.0.1.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tasklane.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, jaeger]
