# TypeScript code for sdk/ts (design §21). Separate from buf.gen.yaml, whose
# `clean: true` owns gen/ and whose plugins must not need node_modules.
# Run from the repo root: go tool -modfile=tools.mod buf generate --template buf.gen.ts.yaml
version: v2
clean: true
plugins:
  - local: sdk/ts/node_modules/.bin/protoc-gen-es
    out: sdk/ts/src/gen
    opt:
      - target=ts
      - import_extension=js
    # Generates google/api/{annotations,http}.proto too; well-known types come
    # from @bufbuild/protobuf/wkt (include_wkt defaults to false).
    include_imports: true
inputs:
  - directory: proto
  # RetryInfo, for the queue-full error.
  - module: buf.build/googleapis/googleapis:8ac61b9e502343289c8c42b17aa5b245
    paths:
      - google/rpc/error_details.proto
