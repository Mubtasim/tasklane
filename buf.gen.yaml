version: v2
clean: true
plugins:
  - local: ["go", "tool", "-modfile=tools.mod", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools.mod", "protoc-gen-go-grpc"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools.mod", "protoc-gen-grpc-gateway"]
    out: gen
    opt: paths=source_relative
