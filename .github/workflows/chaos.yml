name: Chaos

on:
  schedule:
    - cron: "17 3 * * *" # nightly
  workflow_dispatch:
    inputs:
      seed:
        description: "Replay a seed (0 = random)"
        default: "0"

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The seed goes through the environment, not into the script text, so
      # the input can't inject shell commands.
      - run: go test -tags chaos -count=1 -v -timeout 20m ./test/chaos/ -chaos.seed="$SEED"
        env:
          SEED: ${{ inputs.seed || '0' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-output
          path: test/chaos/out/
