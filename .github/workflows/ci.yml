name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: sdk/go

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Integration tests start PostgreSQL with testcontainers in the
      # runner's Docker.
      - run: go test -race -count=1 ./...

  sdk-go:
    # The SDK module on both supported Go releases: its floor (go.mod) and the
    # newest (design §22.2).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: sdk/go/go.sum
      - run: go test -race -count=1 ./...
        working-directory: sdk/go
      - run: scripts/check-sdk-deps.sh
      - name: go.mod files are tidy
        run: |
          (cd sdk/go && go mod tidy -diff)
          if [[ "${{ matrix.go }}" == 1.27.x ]]; then go mod tidy -diff; fi

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking compares against main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go/go.sum
            tools.sum
      - run: go tool -modfile=tools.mod buf lint
      - if: github.event_name == 'pull_request'
        run: go tool -modfile=tools.mod buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
      - name: Generated code is up to date
        run: |
          go tool -modfile=tools.mod buf generate
          git add -N sdk/go/gen/ internal/gateway/ # untracked generated files show up too
          git diff --exit-code sdk/go/gen/ internal/gateway/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tasklane:ci .
      - run: docker build --target server -t tasklane:ci-server . # the published target

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus config and alert rules are valid
        run: >
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.15.1
          check config /etc/prometheus/prometheus.yml
      - name: Envoy config is valid
        run: >
          docker run --rm -v "$PWD/deploy/envoy:/etc/envoy:ro"
          envoyproxy/envoy:v1.36.2 --mode validate -c /etc/envoy/envoy.yaml
      - name: Jaeger config is valid
        run: >
          docker run --rm -v "$PWD/deploy/jaeger:/etc/jaeger:ro"
          jaegertracing/jaeger:2.23.0 validate --config /etc/jaeger/config.yaml
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: CHAOS_LEDGER_DIR=/tmp docker compose -f deploy/docker-compose.yml -f deploy/chaos.override.yml config --quiet
      - run: docker compose -f bench/compose.bench.yml config --quiet
      - run: bash -n bench/run.sh
      - run: scripts/release-check.test.sh
      - name: Workflows are valid
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  k8s-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install helm and kubeconform
        run: |
          BIN="$RUNNER_TEMP/bin" deploy/k8s/tools.sh helm kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/k8s/check.sh
      - run: go test -count=1 ./deploy/k8s/
        env:
          TASKLANE_REQUIRE_HELM: "1"

  sdk-ts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm run build:examples
      - if: matrix.node == 24
        run: npm run check:package
      - if: matrix.node == 24
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum
      - if: matrix.node == 24
        name: Generated TypeScript is up to date
        run: |
          npm run generate
          git add -N src/gen/
          git diff --exit-code src/gen/
